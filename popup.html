<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bing Wallpaper for ChromeOS</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="title">Bing Wallpaper for ChromeOS</div>
      <div class="date" id="dateLabel">-</div>
    </header>

    <div class="preview" id="preview">
      <div class="overlay" id="previewOverlay">Loading...</div>
      <img id="previewImg" alt="Bing daily wallpaper preview" />
    </div>

    <div class="meta">
      <div class="subtitle" id="title">Daily image</div>
      <a id="sourceLink" href="https://www.bing.com" target="_blank" rel="noreferrer noopener">Source link</a>
    </div>

    <div class="controls">
      <button id="btn-prev" aria-label="Previous day" class="icon-btn nav">
        <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
          <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"></path>
        </svg>
        <span>Previous</span>
      </button>
      <button id="btn-refresh" aria-label="Refresh wallpaper" class="ghost icon-btn tiny">
        <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
          <path d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.75 6h-2.08A6 6 0 1 1 12 6c1.3 0 2.53.42 3.53 1.2L13 10h7V3z"></path>
        </svg>
      </button>
      <button id="btn-next" aria-label="Next day" class="icon-btn nav">
        <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
          <path d="m10 6-1.41 1.41L13.17 12l-4.58 4.59L10 18l6-6z"></path>
        </svg>
        <span>Next</span>
      </button>
    </div>

    <div class="status hidden" id="status"></div>

    <a href="https://github.com/TheHTMLProject/Bing-Wallpaper-For-ChromeOS" target="_blank" rel="noreferrer noopener" class="github-link" aria-label="View source on GitHub">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.63-.33 2.47-.33.84 0 1.68.11 2.47.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"></path>
      </svg>
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
